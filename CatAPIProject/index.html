<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat API Project</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      #controls {
        text-align: center;
        margin-bottom: 20px;
      }

      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #45a049;
      }

      #data-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        justify-items: center;
      }

      .cat-card {
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .cat-card:hover {
        transform: scale(1.05);
      }

      .cat-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
      }

      .placeholder {
        width: 100%;
        height: 250px;
        background-color: #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 18px;
      }

      .favorite-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s;
      }

      .favorite-btn:hover {
        background: rgba(255, 255, 255, 1);
      }

      .favorite-btn.favorited {
        background: #ff6b6b;
        color: white;
      }

      .cat-card {
        position: relative;
      }

      h2 {
        text-align: center;
        color: #333;
        margin: 40px 0 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>Random Cat Images</h1>
    <div id="controls">
      <button id="fetch-button">Get New Cats</button>
    </div>
    <div id="data-container">
      <!-- Placeholder cat images will be loaded here -->
      <div class="cat-card">
        <div class="placeholder">Cat Image 1</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 2</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 3</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 4</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 5</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 6</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 7</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 8</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 9</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 10</div>
      </div>
    </div>

    <h2>My Favorite Cats</h2>
    <div id="favorites-container">
      <div class="cat-card">
        <div class="placeholder">No favorites yet. Click the heart on a cat to add it!</div>
      </div>
    </div>
    <script>
      const API_URL = 'https://api.thecatapi.com/v1/images/search?limit=10';
      const dataContainer = document.getElementById('data-container');
      const favoritesContainer = document.getElementById('favorites-container');
      const fetchButton = document.getElementById('fetch-button');

      // localStorage key for favorites
      const FAVORITES_KEY = 'catFavorites';

      // Get favorites from localStorage
      function getFavorites() {
        try {
          const favorites = localStorage.getItem(FAVORITES_KEY);
          return favorites ? JSON.parse(favorites) : [];
        } catch (error) {
          console.error('Error loading favorites:', error);
          return [];
        }
      }

      // Save favorites to localStorage
      function saveFavorites(favorites) {
        try {
          localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
          console.log('Favorites saved:', favorites);
        } catch (error) {
          console.error('Error saving favorites:', error);
        }
      }

      // Check if a cat is favorited
      function isFavorited(catId) {
        const favorites = getFavorites();
        return favorites.some(cat => cat.id === catId);
      }

      // Add cat to favorites
      function addToFavorites(cat) {
        const favorites = getFavorites();
        if (!isFavorited(cat.id)) {
          favorites.push(cat);
          saveFavorites(favorites);
          displayFavorites();
          console.log('Added to favorites:', cat.id);
        }
      }

      // Remove cat from favorites
      function removeFromFavorites(catId) {
        const favorites = getFavorites();
        const updatedFavorites = favorites.filter(cat => cat.id !== catId);
        saveFavorites(updatedFavorites);
        displayFavorites();
        console.log('Removed from favorites:', catId);
      }

      // Display favorites
      function displayFavorites() {
        const favorites = getFavorites();
        favoritesContainer.innerHTML = '';

        if (favorites.length === 0) {
          const placeholder = document.createElement('div');
          placeholder.className = 'cat-card';
          placeholder.innerHTML = '<div class="placeholder">No favorites yet. Click the heart on a cat to add it!</div>';
          favoritesContainer.appendChild(placeholder);
          return;
        }

        favorites.forEach(cat => {
          const card = createCatCard(cat, true); // true indicates it's a favorite
          favoritesContainer.appendChild(card);
        });

        console.log(`Displayed ${favorites.length} favorite cats`);
      }

      // Function to display loading state
      function showLoading() {
        fetchButton.disabled = true;
        fetchButton.textContent = 'Loading...';
        console.log('Loading cat images...');
      }

      // Function to hide loading state
      function hideLoading() {
        fetchButton.disabled = false;
        fetchButton.textContent = 'Get New Cats';
      }

      // Function to create a cat card element
      function createCatCard(cat, isFavorite = false) {
        const card = document.createElement('div');
        card.className = 'cat-card';

        const img = document.createElement('img');
        img.src = cat.url;
        img.alt = `Cat ${cat.id}`;
        img.onerror = function() {
          console.error('Failed to load image:', cat.url);
          card.innerHTML = '<div class="placeholder">Image failed to load</div>';
        };

        const favoriteBtn = document.createElement('button');
        favoriteBtn.className = 'favorite-btn';
        favoriteBtn.innerHTML = '❤️';
        favoriteBtn.title = isFavorite ? 'Remove from favorites' : 'Add to favorites';

        if (isFavorited(cat.id)) {
          favoriteBtn.classList.add('favorited');
        }

        favoriteBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (isFavorited(cat.id)) {
            removeFromFavorites(cat.id);
            favoriteBtn.classList.remove('favorited');
          } else {
            addToFavorites(cat);
            favoriteBtn.classList.add('favorited');
          }
        });

        card.appendChild(img);
        card.appendChild(favoriteBtn);
        return card;
      }

      // Function to fetch and display cat images
      async function fetchCats() {
        showLoading();

        try {
          console.log('Fetching data from:', API_URL);
          const response = await fetch(API_URL);

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const cats = await response.json();
          console.log('Received data:', cats);

          // Clear existing content
          dataContainer.innerHTML = '';

          // Create and append cat cards
          cats.forEach(cat => {
            const card = createCatCard(cat);
            dataContainer.appendChild(card);
          });

          console.log(`Successfully displayed ${cats.length} cat images`);

        } catch (error) {
          console.error('Error fetching cat images:', error);
          dataContainer.innerHTML = '<div class="cat-card"><div class="placeholder">Error loading cats. Please try again.</div></div>';
          alert('Failed to load cat images. Check the console for details.');
        } finally {
          hideLoading();
        }
      }

      // Event listener for the fetch button
      fetchButton.addEventListener('click', fetchCats);

      // Load initial cats and favorites on page load
      document.addEventListener('DOMContentLoaded', function() {
        console.log('Page loaded, fetching initial cat images...');
        fetchCats();
        displayFavorites();
      });
    </script>
  </body>
</html>
