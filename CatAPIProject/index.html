<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat API Project</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      #controls {
        text-align: center;
        margin-bottom: 20px;
      }

      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #45a049;
      }

      #data-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        justify-items: center;
      }

      .cat-card {
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .cat-card:hover {
        transform: scale(1.05);
      }

      .cat-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
      }

      .placeholder {
        width: 100%;
        height: 250px;
        background-color: #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Random Cat Images</h1>
    <div id="controls">
      <button id="fetch-button">Get New Cats</button>
    </div>
    <div id="data-container">
      <!-- Placeholder cat images will be loaded here -->
      <div class="cat-card">
        <div class="placeholder">Cat Image 1</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 2</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 3</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 4</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 5</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 6</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 7</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 8</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 9</div>
      </div>
      <div class="cat-card">
        <div class="placeholder">Cat Image 10</div>
      </div>
    </div>
    <script>
      // Placeholder for future JavaScript functionality
      document.getElementById('fetch-button').addEventListener('click', function() {
        alert('Fetch functionality will be implemented here');
      });
    </script>
  </body>
</html>
